# Ultralytics YOLO 🚀, AGPL-3.0 license
# 本作品最终采用的改进模型结构定义（与 weights/best.pt 完全一致）
#
# 三项改进：
#   ① 主干与颈部全部 C3k2 替换为 C3k2_Faster_EMA（FasterBlock + PConv + EMA 注意力）
#   ② 主干末端（SPPF → C2PSA 之后）插入 TripletAttention，并把颈部 P5 分支的
#      跳跃连接从第 10 层（C2PSA）改接到第 11 层（TripletAttention 输出）
#   ③ 检测头使用 Detect_Efficient；训练损失函数由 CIoU 换为 PIoUv2
#
# 用法（在 ultralytics 工程根目录下）：
#   yolo detect train model=ultralytics/cfg/models/11/yolo11-attention.yaml \
#                data=ultralytics/cfg/datasets/signage_dataset.yaml \
#                epochs=300 batch=32 imgsz=640 optimizer=SGD

# Parameters
nc: 1 # 单类别：signage（工序指示牌）
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # 本文算法：319 层，2.02 M 参数，4.7 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_Faster_EMA, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_Faster_EMA, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_Faster_EMA, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_Faster_EMA, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, TripletAttention, []] # 11  ← 本文新增

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13 cat backbone P4
  - [-1, 2, C3k2_Faster_EMA, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 2, C3k2_Faster_EMA, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C3k2_Faster_EMA, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22 ← 接 TripletAttention 输出（原生为 [-1, 10] 接 C2PSA）
  - [-1, 2, C3k2_Faster_EMA, [1024, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect_Efficient, [nc]] # 24 Detect(P3, P4, P5)
